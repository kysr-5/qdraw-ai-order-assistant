<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Qdraw | AI 接单助手</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">Q</span><span>Qdraw</span></div>
        <nav class="primary-nav" aria-label="主导航">
          <button class="nav-item active" data-view="workspace" type="button">工作台</button>
          <button class="nav-item" data-view="merchants" type="button">商家</button>
        </nav>
        <div class="sidebar-divider"></div>
        <div class="merchant-heading"><span>商家</span><button id="newMerchantButton" class="icon-button" type="button" title="新建商家">+</button></div>
        <div id="merchantList" class="merchant-list"></div>
        <div class="sidebar-footer"><span id="backendDot" class="status-dot"></span><span id="backendState">连接服务中</span></div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div><p class="eyebrow">AI 接单工作台</p><h1 id="merchantTitle">选择一个商家</h1></div>
          <div class="topbar-actions"><button id="newBriefButton" class="primary-button" type="button">新建需求</button></div>
        </header>

        <section id="emptyState" class="empty-state hidden">
          <div class="empty-state-content"><p class="eyebrow">从一次真实对话开始</p><h2>把商家聊天整理成可执行的作画任务书。</h2><p>先新建商家，再粘贴聊天记录。确认后的需求会沉淀为下一次接单可用的偏好。</p><button id="emptyNewMerchantButton" class="primary-button" type="button">新建商家</button></div>
        </section>

        <div id="workspace" class="workspace-grid">
          <section class="chat-panel panel">
            <div class="panel-header"><div><p class="panel-kicker">输入</p><h2>商家聊天</h2></div><span id="chatState" class="subtle-status">待分析</span></div>
            <div class="input-options">
              <label class="compact-field">输入类型<select id="sourceType"><option value="new_requirement">新需求</option><option value="revision_feedback">修改意见</option><option value="supplement">补充说明</option></select></label>
              <label class="compact-checkbox"><input id="useProfile" type="checkbox" checked /> 引用商家画像</label>
            </div>
            <label class="field-label" for="chatInput">粘贴聊天记录</label>
            <textarea id="chatInput" placeholder="例如：这次想做一张店铺周年庆海报，人物是店主和一只柴犬，风格要可爱一点..." spellcheck="false"></textarea>
            <label class="field-label note-label" for="artistNote">画师备注</label>
            <textarea id="artistNote" class="artist-note" placeholder="例如：本次优先确认报价和交付日期" spellcheck="false"></textarea>
            <div class="chat-footer"><span id="chatCount" class="character-count">0 字</span><button id="analyzeButton" class="primary-button" type="button">开始分析</button></div>
            <p id="inputHint" class="input-hint hidden"></p>
          </section>

          <section class="analysis-panel panel">
            <div class="panel-header"><div><p class="panel-kicker">提取结果</p><h2>需求要点</h2></div><span id="analysisState" class="analysis-state">等待聊天内容</span></div>
            <div id="analysisContent" class="analysis-content"><div class="analysis-placeholder">粘贴聊天后，需求要点会显示在这里。</div></div>
            <div id="analysisError" class="inline-error hidden"><span id="analysisErrorText"></span><button id="retryButton" class="small-button" type="button">重试</button></div>
          </section>

          <section class="brief-panel panel">
            <div class="panel-header"><div><p class="panel-kicker">可编辑交付物</p><h2>作画任务书</h2></div><span id="briefState" class="subtle-status">新草稿</span></div>
            <div id="briefForm" class="brief-form">
              <label class="brief-field full"><span>项目名称</span><input data-brief-field="title" type="text" placeholder="例如：周年庆活动主视觉" /></label>
              <label class="brief-field"><span>本次作画目的</span><textarea data-brief-field="goal"></textarea></label>
              <label class="brief-field"><span>使用场景</span><textarea data-brief-field="usage_scene"></textarea></label>
              <label class="brief-field"><span>画面主题</span><textarea data-brief-field="theme"></textarea></label>
              <label class="brief-field"><span>主体与形象设定</span><textarea data-brief-field="subject"></textarea></label>
              <label class="brief-field"><span>风格方向</span><textarea data-brief-field="style"></textarea></label>
              <label class="brief-field"><span>色彩氛围</span><textarea data-brief-field="colors"></textarea></label>
              <label class="brief-field"><span>构图建议</span><textarea data-brief-field="composition"></textarea></label>
              <label class="brief-field"><span>必须包含</span><textarea data-brief-field="must_have"></textarea></label>
              <label class="brief-field"><span>可发挥项</span><textarea data-brief-field="flexible"></textarea></label>
              <label class="brief-field"><span>避免出现</span><textarea data-brief-field="avoid"></textarea></label>
              <label class="brief-field"><span>参考信息</span><textarea data-brief-field="references"></textarea></label>
              <label class="brief-field"><span>待确认问题</span><textarea data-brief-field="questions"></textarea></label>
              <label class="brief-field"><span>画师备注</span><textarea data-brief-field="artist_note"></textarea></label>
            </div>
            <div class="brief-actions"><button id="copyQuestionsButton" class="secondary-button" type="button">复制待确认问题</button><button id="copyBriefButton" class="secondary-button" type="button">复制任务书</button><button id="saveBriefButton" class="secondary-button" type="button">保存草稿</button><button id="confirmBriefButton" class="primary-button" type="button">确认任务书</button></div>
          </section>

          <aside class="profile-panel panel">
            <div class="panel-header"><div><p class="panel-kicker">长期记忆</p><h2>商家画像</h2></div><span id="profileConfidence" class="confidence-label">待积累</span></div>
            <div id="profileContent" class="profile-content"></div>
            <div id="profileSuggestion" class="profile-suggestion hidden"></div>
          </aside>
        </div>

        <section id="reviewPanel" class="review-panel panel hidden">
          <div class="panel-header"><div><p class="panel-kicker">交付前核查</p><h2>成稿审查与修改单</h2></div><span id="reviewState" class="subtle-status">等待任务书确认</span></div>
          <div id="reviewContent"></div>
        </section>

        <section id="merchantView" class="merchant-view hidden">
          <div class="merchant-view-header"><div><p class="eyebrow">商家档案</p><h2 id="merchantViewTitle">商家管理</h2></div><button id="merchantViewNewBrief" class="primary-button" type="button">为该商家新建需求</button></div>
          <div class="merchant-detail-grid">
            <form id="merchantDetailForm" class="panel merchant-edit-panel">
              <div class="panel-header"><div><p class="panel-kicker">基础资料</p><h2>商家信息</h2></div></div>
              <label class="dialog-field">商家名称<input id="detailMerchantName" required type="text" /></label>
              <label class="dialog-field">行业<input id="detailMerchantIndustry" type="text" placeholder="例如：咖啡店、花艺、服装" /></label>
              <label class="dialog-field">联系人备注<input id="detailMerchantNote" type="text" /></label>
              <label class="dialog-field">品牌关键词<input id="detailMerchantKeywords" type="text" placeholder="使用逗号分隔" /></label>
              <div class="detail-actions"><button id="deleteMerchantButton" class="danger-button" type="button">删除商家</button><button class="primary-button" type="submit">保存资料</button></div>
            </form>
            <section class="panel merchant-history-panel"><div class="panel-header"><div><p class="panel-kicker">可追溯归档</p><h2>历史任务</h2></div></div><div id="merchantHistory" class="merchant-history"></div></section>
          </div>
        </section>
      </main>
    </div>

    <dialog id="merchantDialog" class="merchant-dialog"><form method="dialog" id="merchantForm"><div class="dialog-heading"><div><p class="eyebrow">商家档案</p><h2>新建商家</h2></div><button class="icon-button" value="cancel" type="submit" title="关闭">×</button></div><label class="dialog-field">商家名称<input id="merchantNameInput" required type="text" placeholder="例如：花田咖啡" /></label><label class="dialog-field">行业<input id="merchantIndustryInput" type="text" placeholder="例如：咖啡店" /></label><label class="dialog-field">联系人备注<input id="merchantNoteInput" type="text" placeholder="例如：小红书店铺，首次合作" /></label><label class="dialog-field">品牌关键词<input id="merchantKeywordsInput" type="text" placeholder="例如：夏日、亲切、手绘" /></label><div class="dialog-actions"><button value="cancel" class="secondary-button" type="submit">取消</button><button value="default" class="primary-button" type="submit">创建商家</button></div></form></dialog>

    <dialog id="briefDialog" class="brief-dialog"><div class="dialog-heading"><div><p class="eyebrow">已归档任务</p><h2 id="briefDialogTitle">任务书</h2></div><button id="closeBriefDialog" class="icon-button" type="button" title="关闭">×</button></div><div id="briefDialogContent" class="brief-dialog-content"></div></dialog>
    <div id="toast" class="toast hidden" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
